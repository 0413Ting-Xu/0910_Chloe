<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日小清單</title>
<meta name="theme-color" content="#F7FAFE">
<meta name="description" content="每天打勾的保養、保健、眼睛照護小清單">
<meta property="og:type" content="website">
<meta property="og:title" content="每日小清單">
<meta property="og:description" content="每天打勾的保養、保健、眼睛照護小清單">
<meta property="og:image" content="https://0413ting-xu.github.io/daily-checklist/images/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日小清單">
<link rel="icon" type="image/png" href="images/icon-180.png">
<link rel="apple-touch-icon" href="images/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --pink-50:#FFF6F8; --pink-100:#FFE9EF; --pink-200:#FCD6E0; --pink-300:#F7B9CA; --pink-400:#EF98B0; --pink-600:#CF6A8A;
  --blue-50:#F3F8FE; --blue-100:#E4F0FB; --blue-200:#C9E1F6; --blue-300:#9FC9EE; --blue-400:#6EA9DF; --blue-600:#3F7DBB;
  --butter:#F4D88F;
  --ink:#4A4E5B; --ink-2:#7D8392; --ink-3:#B4B9C5;
  --line:#EEF0F4; --soft:#F4F6F9;
  --card:#FFFFFF;
  --r-lg:28px; --r:20px; --r-sm:14px;
  --shadow:0 1px 2px rgba(74,78,91,.04), 0 10px 30px rgba(130,150,185,.10);
  --font:"Huninn","Zen Maru Gothic","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
html:has(dialog[open]){overflow:hidden}
body{margin:0;font-family:var(--font);color:var(--ink);background:#FBFCFE;min-height:100vh;min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;font-synthesis:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(60vmax 45vmax at -10% -10%, #FFF0F4 0%, rgba(255,240,244,0) 62%),
  radial-gradient(80vmax 65vmax at 110% 110%, #DCECFA 0%, rgba(220,236,250,0) 65%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:400;margin:0}
img{display:block}
.ic{width:20px;height:20px;flex:none}
.ic.fill{fill:currentColor;stroke:none}

.tone-blue{--c1:var(--blue-100);--c2:var(--blue-200);--c3:var(--blue-300);--c4:var(--blue-400);--c6:var(--blue-600);--tint:var(--blue-50)}
.tone-pink{--c1:var(--pink-100);--c2:var(--pink-200);--c3:var(--pink-300);--c4:var(--pink-400);--c6:var(--pink-600);--tint:var(--pink-50)}
.tone-butter{--c1:#FCF1D2;--c2:#F8E4AE;--c3:#F4D88F;--c4:#E5BC5C;--c6:#A97F1F;--tint:#FEF9EC}
.tone-mint{--c1:#DFF3EA;--c2:#C6E9D9;--c3:#A9DCC5;--c4:#78C2A2;--c6:#3E8C6A;--tint:#F2FAF6}
.tone-lilac{--c1:#EEE9FB;--c2:#DDD3F6;--c3:#C9BAF0;--c4:#A994E3;--c6:#6E57B5;--tint:#F7F4FD}

/* ---------- layout ---------- */
.app{max-width:1220px;margin:0 auto;padding:max(14px, env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
main{container:main / inline-size;min-width:0}
.art{display:none}

/* ---------- mobile header ---------- */
.m-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 14px}
.m-brand{display:flex;align-items:center;gap:9px;min-width:0;font-size:18px;letter-spacing:.02em;white-space:nowrap}
@media (max-width:380px){ .m-brand{font-size:17px;gap:8px} .m-av span{width:34px;height:34px} }
.demo-pill{white-space:nowrap}
.m-av{display:flex}
.m-av span{position:relative;width:40px;height:40px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 0 0 2.5px #fff, 0 4px 12px rgba(130,150,185,.18)}
.m-av span + span{margin-left:-12px}
.m-av img{position:absolute;left:-25%;top:-22%;width:150%;height:150%;object-fit:cover}
.streak{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:#fff;color:var(--blue-600);font-size:14px;box-shadow:var(--shadow)}
.streak .face{width:24px;height:22px;object-fit:contain;margin:-3px 0 -3px -4px}
.face.pop{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}

/* ---------- nav ---------- */
.nav{position:fixed;z-index:30;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 6px 6px;border-radius:26px;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 34px rgba(110,130,170,.18), inset 0 0 0 1px rgba(255,255,255,.7)}
/* The current tab's icon rises a little into a blue bubble. */
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 5px;border-radius:20px;font-size:12.5px;color:var(--ink-2);transition:color .2s}
.nav .bub{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .25s, box-shadow .25s, color .2s}
.nav button .ic{width:21px;height:21px}
.nav button.on{color:var(--blue-600)}
.nav button.on .bub{background:linear-gradient(135deg,var(--blue-300),var(--blue-400));color:#fff;transform:translateY(-6px);box-shadow:0 0 0 3px #fff, 0 6px 12px rgba(110,169,223,.4)}
.nav button.on span:last-child{margin-top:-6px}

/* ---------- shared ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--ink-2);box-shadow:0 2px 10px rgba(130,150,185,.14);transition:transform .15s, background .2s;flex:none}
.icon-btn:active{transform:scale(.92)}
.icon-btn.soft{background:var(--c1, var(--soft));color:var(--c6, var(--ink-2));box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:16px;font-size:16px;transition:transform .15s, filter .2s}
.btn:active{transform:scale(.97)}
.btn .ic{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--blue-100),var(--blue-200));color:var(--blue-600)}
.btn.primary:hover{filter:saturate(1.2)}
.btn.ghost{background:var(--soft);color:var(--ink-2)}
.btn.danger{background:var(--pink-50);color:var(--pink-600)}
.btn.full{width:100%}
.btn.sm{padding:9px 16px;font-size:14.5px;border-radius:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:1;color:var(--ink-2);background:var(--soft);padding:6px 10px;border-radius:999px;white-space:nowrap}
.view{animation:viewIn .35s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px}
.datebar-mid{text-align:center;min-width:0}
.datebar-main{font-size:24px;letter-spacing:.02em;line-height:1.3}
.datebar-sub{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--ink-2);min-height:26px}
.back-pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--blue-100);color:var(--blue-600)}
@container main (min-width:700px){
  .datebar{justify-content:flex-start;margin-bottom:20px}
  .datebar-mid{order:-1;text-align:left;margin-right:auto}
  .datebar-sub{justify-content:flex-start}
  .datebar-main{font-size:28px}
}

/* ---------- today ---------- */
.today-grid{display:grid;gap:16px;align-items:start}
@container main (min-width:720px){
  .today-grid{grid-template-columns:1fr 1fr;gap:20px}
  .today-grid .skin{grid-column:1/-1}
}
.slot-head{display:flex;align-items:center;gap:14px}
.slot-actions{display:flex;align-items:center;gap:8px;flex:none}
.all-btn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 13px 0 10px;border-radius:999px;background:var(--c1);color:var(--c6);font-size:14px;white-space:nowrap;transition:transform .15s, opacity .2s}
.all-btn:active{transform:scale(.94)}
.all-btn .ic{width:16px;height:16px;stroke-width:2.4}
.slot.is-complete .all-btn,.today-grid.is-future .all-btn{display:none}
.avatar{position:relative;width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none;background:#fff;box-shadow:0 0 0 3px var(--c1);transition:width .35s, height .35s}
.slot.is-folded .avatar{width:44px;height:44px}
.avatar img{position:absolute;left:-26%;top:-22%;width:152%;height:152%;object-fit:cover}
.avatar img.fit,.toast-av img.fit{left:0;top:0;width:100%;height:100%}
.slot-title{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;cursor:default}
.slot.is-complete .slot-title{cursor:pointer}
.slot-name{display:flex;align-items:center;gap:6px;font-size:20px;line-height:1.3;white-space:nowrap}
.slot-name .ic{color:var(--c4);width:19px;height:19px}
.fold-ic{width:16px;height:16px;color:var(--ink-3);transition:transform .35s}
.slot:not(.is-folded) .fold-ic{transform:rotate(180deg)}
.slot-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s cubic-bezier(.3,.9,.3,1)}
.slot.is-folded .slot-body{grid-template-rows:0fr}
.slot-inner{min-height:0;overflow:hidden;transition:opacity .25s}
.slot.is-folded .slot-inner{opacity:0}
.slot-count{font-size:14px;color:var(--ink-2);min-height:22px;display:flex;align-items:center;gap:4px}
.done-badge{display:inline-flex;align-items:center;gap:4px;background:var(--c1);color:var(--c6);padding:2px 10px 2px 8px;border-radius:999px;font-size:13px;animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.done-badge .ic{width:14px;height:14px}
.bar{height:6px;border-radius:9px;background:var(--c1);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c3),var(--c4));transition:width .45s cubic-bezier(.3,.9,.3,1)}
.items{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{position:relative}
.item-main{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--tint);border:1.5px solid transparent;text-align:left;transition:background .2s, transform .12s}
.item-main:hover{background:var(--c1)}
.item-main:active{transform:scale(.985)}
.item.is-extra .item-main{border-style:dashed;border-color:var(--c2);padding-right:52px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--c3);display:grid;place-items:center;flex:none;color:#fff;background:#fff;transition:background .2s, border-color .2s}
.check .ic{width:16px;height:16px;stroke-width:2.6;opacity:0;transform:scale(.4);transition:opacity .2s, transform .25s cubic-bezier(.34,1.56,.64,1)}
.is-done .check{background:var(--c4);border-color:var(--c4)}
.is-done .check .ic{opacity:1;transform:none}
.item.pop .check{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.item-text{flex:1;min-width:0;display:flex;flex-direction:column}
.item-name{display:flex;align-items:center;gap:8px;font-size:16px;line-height:1.35;transition:color .2s}
.item-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-note{font-size:13px;color:var(--ink-3);padding-left:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.is-done .item-name{color:var(--ink-3)}
.is-done .item-name span{text-decoration:line-through;text-decoration-color:var(--c3);text-decoration-thickness:1.5px}
.item .tag{background:#fff}
.item-x{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.item-x:hover{background:#fff;color:var(--ink-2)}
.item-x .ic{width:16px;height:16px}
.item-main,.slot-title,[data-hold="title"]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-hold="title"]{cursor:default;transition:opacity .2s}
[data-hold="title"].holding{opacity:.55;transition:opacity .5s ease}
.brand-name{flex:none;max-width:min(12em,50vw);overflow:hidden;text-overflow:ellipsis}
.item-main.holding{transform:scale(.96);transition:transform .5s ease}
.slot-title.holding{opacity:.6;transition:opacity .5s ease}
.check .ic-dash{display:none}
.is-skip .check{background:#fff;border-style:dashed;border-color:var(--ink-3);color:var(--ink-2)}
.is-skip .check .ic-check{display:none}
.is-skip .check .ic-dash{display:block;opacity:1;transform:none}
.is-skip .item-name{color:var(--ink-3)}
.tag-skip{display:none}
.is-skip .tag-step{display:none}
.is-skip .tag-skip{display:inline-flex}
.today-grid.is-future .item-main,.today-grid.is-future .skin .chip,.today-grid.is-future .note{pointer-events:none;opacity:.55}
.tip{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;margin:-4px 0 16px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:15px}
.tip + .tip{margin-top:-6px}
.tip img{width:30px;height:28px;object-fit:contain;flex:none}
.tip span{flex:1;min-width:0}
.tip .icon-btn{box-shadow:none;background:var(--soft)}
.slot-empty{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;padding:22px 0;border-radius:18px;background:var(--tint);color:var(--ink-3);font-size:15px}
.slot-empty .ic{color:var(--c3)}

.skin-head{display:flex;align-items:center;justify-content:space-between;margin:-4px -4px 14px 0}
.skin h2{display:flex;align-items:center;gap:8px;font-size:18px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm .ic{width:17px;height:17px}
.skin h2 .ic{color:var(--blue-300)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:999px;background:var(--soft);font-size:14.5px;color:var(--ink-2);transition:background .2s, color .2s, transform .12s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--blue-100);color:var(--blue-600)}
.chips.sm .chip{padding:6px 12px;font-size:13.5px}
.note{display:block;width:100%;margin-top:14px;font:inherit;font-size:15.5px;color:var(--ink);padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:#FCFDFE;resize:none;outline:none;transition:border-color .2s, box-shadow .2s}
.note:focus{border-color:var(--blue-300);box-shadow:0 0 0 4px var(--blue-50);background:#fff}
.note::placeholder,.input::placeholder{color:var(--ink-3)}

.welcome{text-align:center;padding:32px 24px 28px}
.welcome img{width:min(240px,70%);margin:0 auto 8px;mix-blend-mode:multiply}
.welcome h2{font-size:19px;margin-bottom:18px;color:var(--ink-2)}
.welcome-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- week ---------- */
.wk{--col:31px;padding:16px 12px 10px;margin-bottom:16px}
.wk-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(7,var(--col));align-items:center;min-height:48px}
.wk-row + .wk-row{border-top:1px solid var(--line)}
.wk-head{min-height:56px;border-bottom:1px solid var(--line)}
.wk-head + .wk-row{border-top:0}
.wk-title{display:flex;align-items:center;gap:7px;font-size:18px}
.wk-title .ic{color:var(--c4)}
.wk-name{display:flex;align-items:center;gap:7px;min-width:0;font-size:14px;line-height:1.3;padding:6px 6px 6px 2px}
.wk-name .dot{width:8px;height:8px}
.wk-name span{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;word-break:break-all}
.wk-cell{display:grid;place-items:center;align-self:stretch}
.wk-cell.today{background:var(--tint)}
.wk-day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px 14px 0 0}
.wk-day .wd{font-size:14px;color:var(--ink-2)}
.wk-day .dn{font-size:12px;color:var(--ink-3)}
.wk-day.today .wd{color:var(--c6)}
.wk-day.today .dn{color:var(--c4)}
.mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.wk-mark{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wk-mark:disabled{cursor:default}
.wk-mark:not(:disabled):active .mk{transform:scale(.85)}
.wk-mark.holding .mk{transform:scale(.8);transition:transform .5s}
.mk.plan{background:var(--c1);box-shadow:inset 0 0 0 1.5px var(--c2)}
.mk.done{background:var(--c4);color:#fff}
.mk.done .ic{width:13px;height:13px;stroke-width:3}
.mk.off{width:4px;height:4px;background:var(--line)}
.mk.skip{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink-3)}
.mk.skip .ic{width:12px;height:12px;stroke-width:3}
.wk-empty{padding:16px 0 10px;text-align:center;color:var(--ink-3)}
@container main (min-width:560px){ .wk{--col:52px;padding:18px 20px 12px} .wk-name{font-size:15px} }
@container main (min-width:760px){ .wk{--col:64px} .mk{width:26px;height:26px} }

/* ---------- products ---------- */
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.view-head h1{font-size:24px;display:flex;align-items:baseline;gap:10px}
.view-head h1 small{font-size:15px;color:var(--ink-3)}
.prod-grid{display:grid;gap:12px}
.view-actions{display:flex;gap:8px}
.cat-title{display:flex;align-items:center;gap:9px;font-size:18px;margin:30px 6px 4px}
.cat-title::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cc)}
.cat-group:first-of-type .cat-title{margin-top:6px}
.cat-sep{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);margin:6px 4px 0}
.cat-sep::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc)}
.items .cat-sep:first-child{margin-top:0}
.pick-list .cat-sep{margin:12px 6px 4px}
.pick-list .cat-sep:first-child{margin-top:0}
.cat-chip.on{background:color-mix(in srgb, var(--cc) 30%, #fff);color:var(--ink)}
.group-title{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);margin:22px 6px 10px}
.group-title:first-of-type{margin-top:4px}
.group-title small{font-size:13px;color:var(--ink-3)}
.prod.sorting{cursor:default}
.prod.sorting:hover{transform:none}
.sort-btns{display:flex;gap:6px}
.sort-btns button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink-2)}
.sort-btns button:disabled{opacity:.3;cursor:default}
.sort-btns .ic{width:17px;height:17px}
@container main (min-width:640px){ .prod-grid{grid-template-columns:1fr 1fr;gap:16px} }
.prod{display:flex;flex-direction:column;gap:12px;padding:18px;cursor:pointer;transition:transform .15s, box-shadow .2s;outline:none}
.prod:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(74,78,91,.04), 0 16px 36px rgba(130,150,185,.16)}
.prod:focus-visible{box-shadow:0 0 0 3px var(--blue-200)}
.prod.is-paused{opacity:.55}
.prod-top{display:flex;align-items:center;gap:10px}
.prod-top .dot{width:12px;height:12px}
.prod-name{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-times{display:flex;gap:6px}
.prod-times span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--c1);color:var(--c6)}
.prod-times .ic{width:16px;height:16px}
.prod-note{font-size:14px;color:var(--ink-2);margin-top:-4px;padding-left:22px}
.prod-meta{display:flex;flex-wrap:wrap;gap:6px;padding-left:22px}
.tag.warn{background:var(--pink-50);color:var(--pink-600)}
.restock{padding:16px 18px;margin-bottom:6px}
.restock h2{display:flex;align-items:center;gap:8px;font-size:16px;margin-bottom:12px}
.restock h2 .ic{color:var(--blue-400)}
.backup{display:flex;justify-content:center;gap:10px;margin-top:28px}

/* ---------- history ---------- */
.hist-head{display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:16px;overflow:hidden}
.hist-head img{width:92px;height:88px;object-fit:cover;object-position:50% 30%;mix-blend-mode:multiply;flex:none}
.stats{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:18px;background:var(--tint, var(--blue-50))}
.stat .ic{width:18px;height:18px;color:var(--c4, var(--blue-400))}
.stat .face{width:24px;height:22px;object-fit:contain;margin-bottom:-2px}
.stat b{font-weight:400;font-size:22px;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink-2)}
.cal{padding:16px 14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-wd{text-align:center;font-size:13px;color:var(--ink-3);padding:4px 0 8px}
.cal-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;aspect-ratio:1/1.08;border-radius:16px;transition:background .2s}
.cal-cell:hover{background:var(--soft)}
.cal-num{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;font-size:15px;transition:background .2s}
.cal-cell.future .cal-num{color:var(--ink-3)}
.cal-cell.full .cal-num{background:var(--blue-50)}
.cal-cell.today .cal-num{color:var(--blue-600)}
.cal-cell::after{content:"";width:4px;height:4px;border-radius:50%}
.cal-cell.today::after{background:var(--blue-400)}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible;pointer-events:none}
.ring circle{fill:none;stroke-width:3}
.ring-track{stroke:var(--line)}
.ring-fill{stroke:url(#ringGrad);stroke-linecap:round}

.notes{margin-top:16px;padding:18px 14px 12px}
.notes h2{display:flex;align-items:center;gap:8px;font-size:18px;margin:0 6px 8px}
.notes h2 .ic{color:var(--blue-300)}
.notes h2 small{font-size:14px;color:var(--ink-3)}
.note-row{width:100%;display:flex;align-items:flex-start;gap:14px;text-align:left;padding:12px 8px;border-radius:18px;transition:background .2s}
.note-row:hover{background:var(--soft)}
.note-row + .note-row{margin-top:2px}
.note-date{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;padding:6px 0 5px;border-radius:14px;background:var(--blue-50)}
.note-date b{font-weight:400;font-size:20px;line-height:1.15}
.note-date span{font-size:12px;color:var(--ink-2)}
.note-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:3px}
.note-tags{display:flex;flex-wrap:wrap;gap:6px}
.note-tags .tag{background:var(--blue-50);color:var(--blue-600)}
.note-text{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.note-skip{font-size:14px;color:var(--ink-2)}
.note-ev{display:flex;flex-wrap:wrap;gap:6px}
.note-ev .tag{background:var(--blue-50);color:var(--blue-600)}
.trend{margin-top:16px;padding:18px 18px 14px}
.trend h2{display:flex;align-items:center;gap:8px;font-size:18px;margin-bottom:10px}
.trend h2 .ic{color:var(--blue-300)}
.trend-row{display:grid;grid-template-columns:minmax(0,72px) 1fr 44px;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.trend-row > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trend-bar{height:10px;border-radius:9px;background:var(--blue-50);overflow:hidden}
.trend-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue-200),var(--blue-400))}
.trend-row b{font-weight:400;font-size:14px;color:var(--ink-2);text-align:right}
/* product detail */
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.detail-head h2{flex:1;min-width:0;font-size:21px;line-height:1.3;word-break:break-word}
.detail-head .dot{width:14px;height:14px}
.detail-head .icon-btn{box-shadow:none;background:var(--soft)}
.detail-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.dstat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:18px;background:var(--blue-50)}
.dstat b{font-weight:400;font-size:22px;line-height:1.2}
.dstat span{font-size:12.5px;color:var(--ink-2)}
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.strip i{aspect-ratio:1;border-radius:3px;background:var(--blue-50)}
.strip i.done{background:var(--blue-300)}
.strip i.skip{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.strip i.miss{background:#fff;box-shadow:inset 0 0 0 1.5px var(--blue-200)}
.strip-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin:6px 0 18px}
.dsec{margin-bottom:18px}
.dsec h3{font-size:14px;font-weight:400;color:var(--ink-2);margin:0 0 8px}
.dlist{display:flex;flex-direction:column;gap:4px}
.drow{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:14px;background:#FAFBFD;font-size:15px}
.drow > span:first-child{color:var(--ink-2);flex:none}
.drow > span:last-child{text-align:right}
.drow .warn{color:var(--pink-600)}
.head-actions{display:flex;align-items:center;gap:8px}
.why-list{padding-bottom:6px}
.why-list .chip{padding:10px 18px;font-size:15.5px}
.date-row,.life-row{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink-2);margin-bottom:10px}
.date-row > span,.life-row > span{flex:none;width:76px}
.date-row .input{flex:1;width:auto;min-width:0;padding:9px 12px}
.life-row{align-items:flex-start}
.life-row > span{padding-top:6px}
.life-row .chips{flex:1}
@container main (min-width:640px){
  .hist-head img{width:130px;height:110px}
  .cal{padding:22px 24px}
  .cal-grid{gap:8px}
  .cal-cell{aspect-ratio:1/.82}
  .cal-num{font-size:16px;width:40px;height:40px}
}

/* ---------- dialogs ---------- */
.dlg{border:0;padding:0;background:transparent;max-width:none;max-height:none;margin:auto;color:inherit;overflow:visible}
.dlg::backdrop{background:rgba(74,78,91,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.dlg[open]{animation:dlgIn .3s cubic-bezier(.2,.9,.3,1.05)}
@keyframes dlgIn{from{opacity:0;transform:translateY(14px) scale(.98)}}
.sheet{background:#fff;border-radius:var(--r-lg);width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;padding:22px 22px 24px;box-shadow:0 24px 60px rgba(74,78,91,.18)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheet-head h2{font-size:21px}
.sheet-head .icon-btn{box-shadow:none;background:var(--soft)}
.field{margin-bottom:20px}
.lbl{display:block;font-size:14px;color:var(--ink-2);margin-bottom:9px}
.input{width:100%;font:inherit;font-size:16px;color:var(--ink);padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#FCFDFE;outline:none;transition:border-color .2s, box-shadow .2s}
.input:focus{border-color:var(--blue-300);background:#fff;box-shadow:0 0 0 4px var(--blue-50)}
.times{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.time-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0;border-radius:16px;background:var(--soft);color:var(--ink-3);font-size:16px;transition:background .2s, color .2s}
.time-btn.on{background:var(--c1);color:var(--c6)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:15px;padding:4px}
.seg button{padding:9px 0;border-radius:12px;font-size:14.5px;color:var(--ink-2);transition:background .2s, color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(74,78,91,.08)}
.freq-panel{margin-top:14px;padding:16px;border-radius:18px;background:#FAFBFD}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.days button{width:100%;max-width:42px;aspect-ratio:1;justify-self:center;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;color:var(--ink-2);transition:background .2s, color .2s}
.days button.on{background:var(--blue-200);box-shadow:none;color:var(--blue-600)}
.interval-row{display:flex;align-items:center;gap:12px;font-size:15.5px;color:var(--ink-2)}
.interval-row + .interval-row{margin-top:12px}
.interval-row .input{width:auto;flex:1;padding:9px 12px}
.seg.sm{margin-top:12px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.seg.sm button{font-size:13.5px;padding:7px 0}
.seg.sm button.on{background:var(--blue-100);color:var(--blue-600);box-shadow:none}
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.lbl-row .lbl{margin:0}
.mini-toggle{font-size:13px;padding:5px 12px;border-radius:999px;background:var(--soft);color:var(--ink-2);transition:background .2s, color .2s}
.mini-toggle.on{background:var(--blue-100);color:var(--blue-600)}
.freq-sub{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--c6);margin:16px 0 8px}
.freq-sub:first-of-type{margin-top:4px}
.freq-sub .ic{width:16px;height:16px;color:var(--c4)}
.more-btn{width:100%;display:flex;align-items:center;gap:8px;padding:13px 14px;border-radius:16px;background:#FAFBFD;color:var(--ink-2);font-size:15px;margin-bottom:20px;text-align:left}
.more-btn .sum{flex:1;min-width:0;text-align:right;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more-btn .ic{width:18px;height:18px;transition:transform .3s}
.more-btn.open .ic{transform:rotate(180deg)}
.more-btn.open .sum{visibility:hidden}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.3,.9,.3,1)}
.more.open{grid-template-rows:1fr}
.more > div{min-height:0;overflow:hidden;margin:0 -4px;padding:0 4px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
.stepper button{width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:18px;line-height:1;color:var(--ink-2)}
.stepper b{font-weight:400;min-width:28px;text-align:center;font-size:18px;color:var(--ink)}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.tag-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.tag-row{display:flex;align-items:center;gap:2px}
.tag-row .input{margin-right:6px}
/* ---------- settings ---------- */
.set-card{padding:18px 16px 16px;margin-bottom:14px}
.set-card h2{display:flex;align-items:center;gap:8px;font-size:17px;margin:0 2px 12px}
.set-card h2 .ic{color:var(--blue-400);width:19px;height:19px}
.set-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.set-list:last-child{margin-bottom:0}
.set-row-wrap{display:flex;align-items:center;gap:4px}
.set-row-wrap .set-row{flex:1;min-width:0}
.set-row-wrap .tag-btn:disabled{visibility:hidden}
.set-row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px;border-radius:18px;background:var(--tint, #FAFBFD);text-align:left;cursor:pointer}
.set-row .avatar{width:42px;height:42px}
.set-main{flex:1;min-width:0;display:flex;flex-direction:column}
.set-main b{font-weight:400;font-size:16.5px}
.set-main span{font-size:13px;color:var(--ink-3)}
.set-time{font-size:17px;color:var(--c6, var(--ink-2));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.set-chev{width:17px;height:17px;color:var(--ink-3)}
.set-select{font:inherit;font-size:15px;color:var(--ink-2);border:0;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 0 0 1.5px var(--line)}
.dot.lg{width:14px;height:14px;margin:0 4px}
.btn.full{width:100%;justify-content:center}
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.look{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0 10px;border-radius:18px;background:var(--soft);color:var(--ink-2);font-size:14px;transition:background .2s}
.look .avatar{width:52px;height:52px;box-shadow:0 0 0 3px #fff}
.look.on{background:var(--c1);color:var(--c6)}
.look.on .avatar{box-shadow:0 0 0 3px var(--c4)}
.time-input{font-size:20px;text-align:center}
.set-row.static{cursor:default}
.set-row .switch{flex:none}
.sheet-foot[hidden]{display:none}
.reset-chip{margin-top:8px}
.hint-chip{display:block;margin:-6px 0 18px;background:var(--blue-100);color:var(--blue-600)}
.pause-chips .chip{padding:12px 20px;font-size:16px}
.mark-chips{margin-top:12px}
.mark-chips small{margin-left:6px;font-size:12px;opacity:.75}
.pick-chips .chip{padding:10px 16px;font-size:15px}
.remind-time{margin-top:12px}
.slot.ping{animation:ping 1.2s ease-out 2}
@keyframes ping{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px var(--blue-200),var(--shadow)}}
.set-row.on .switch{background:var(--blue-300)}
.set-row.on .switch i{transform:translateX(18px)}
.news-badge{flex:none;font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:var(--blue-300);color:#fff}
.news-item{padding:14px 16px;margin-bottom:10px;border-radius:18px;background:#FAFBFD}
.news-item.is-new{background:var(--blue-50);box-shadow:inset 0 0 0 1.5px var(--blue-100)}
.news-head{display:flex;align-items:center;gap:8px;font-size:15px}
.news-head b{font-weight:400;color:var(--blue-600)}
.news-date{margin-left:auto;font-size:13px;color:var(--ink-3)}
.news-item h3{font-size:17px;margin:6px 0 0}
.news-item ul{margin-top:8px}
.news-item ul{margin:0;padding-left:1.2em;font-size:15px;line-height:1.75;color:var(--ink-2)}
/* first-use tour */
.tour{position:relative;text-align:center;padding-top:34px}
.tour-x{position:absolute;right:14px;top:14px}
.tour-art{min-height:150px;display:flex;align-items:center;justify-content:center;margin:6px 0 14px}
.tour-img{width:min(210px,64%);mix-blend-mode:multiply}
.tour h2{font-size:21px;margin-bottom:8px}
.tour p{margin:0 auto 4px;max-width:21em;font-size:15.5px;line-height:1.7;color:var(--ink-2)}
.tour-dots{display:flex;justify-content:center;gap:7px;margin:18px 0 20px}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--blue-100);transition:width .25s, background .25s}
.tour-dots i.on{width:20px;border-radius:7px;background:var(--blue-300)}
.mock-item{position:relative;display:flex;align-items:center;gap:12px;padding:15px 18px;border-radius:20px;background:var(--blue-50);box-shadow:0 0 0 1.5px var(--blue-100);font-size:17px;min-width:240px}
.mock-check{width:26px;height:26px;border-radius:50%;border:2px dashed var(--ink-3)}
.mock-finger{position:absolute;right:-6px;bottom:-26px;width:42px;height:42px;color:var(--blue-400);animation:press 1.8s ease-in-out infinite}
.mock-finger .ic{width:100%;height:100%;fill:#fff}
@keyframes press{0%,100%{transform:translateY(0) scale(1)}45%,60%{transform:translateY(-8px) scale(.9)}}
.mock-rows{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:250px}
.mock-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;background:var(--blue-50);font-size:16px;text-align:left}
.mock-plus{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-100);color:var(--blue-600);flex:none}
.mock-brand{padding:6px 12px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:9.5em}
.mock-cloud{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--blue-100);color:var(--blue-400)}
.mock-cloud .ic{width:50px;height:50px}
.pin-input{text-align:center;letter-spacing:.5em;font-size:22px;padding-left:calc(14px + .5em)}
.pin-input::placeholder{letter-spacing:.05em;font-size:16px}
.form-err{min-height:20px;margin-top:8px;font-size:14px;color:var(--pink-600)}
.swap-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 15px 5px 5px}
.swap-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#fff}
.swap-chip.on{background:var(--c1);color:var(--c6);box-shadow:inset 0 0 0 1.5px var(--c3)}
#slotForm.swap > *{animation:swapIn .35s ease}
@keyframes swapIn{from{opacity:.2;transform:translateX(14px)}to{opacity:1;transform:none}}
.tag-btn{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.tag-btn:hover{background:var(--soft);color:var(--ink-2)}
.tag-btn.del:hover{color:var(--pink-600)}
.tag-btn .ic{width:18px;height:18px}
.tag-row:first-child [data-act="tag-up"]{visibility:hidden}
.tag-add{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.tag-add .input{border-style:dashed}
.colors button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 3px #fff, 0 0 0 1.5px var(--line);transition:box-shadow .2s, transform .15s}
.colors button.on{box-shadow:inset 0 0 0 3px #fff, 0 0 0 2px var(--ink-3);transform:scale(1.06)}
.switch-row{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:16px;background:#FAFBFD;font-size:15.5px;color:var(--ink-2);margin-bottom:20px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.3,.9,.3,1.2)}
.switch-row.on .switch{background:var(--blue-300)}
.switch-row.on .switch i{transform:translateX(18px)}
.sheet-foot{display:flex;gap:10px}
.sheet-foot .primary{flex:1}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pick-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.pick{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:16px;background:#FAFBFD;text-align:left;font-size:16px;transition:background .2s}
.pick:hover{background:var(--soft)}
.pick span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-empty{padding:26px 0;text-align:center;color:var(--ink-3)}
@media (max-width:359px){
  .slot-head{gap:10px}
  .avatar,.slot.is-folded .avatar{width:42px;height:42px}
  .slot-name .ic{display:none}
  .slot-actions{gap:6px}
  .slot-actions .icon-btn{width:36px;height:36px}
  .all-btn{height:34px;padding:0 10px;font-size:13px}
  .all-btn .ic{display:none}
}
@media (max-width:640px){
  .dlg{margin:auto 0 0;width:100%}
  .dlg[open]{animation:sheetUp .34s cubic-bezier(.2,.9,.3,1)}
  .sheet{width:100%;border-radius:28px 28px 0 0;max-height:92dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
}
@keyframes sheetUp{from{transform:translateY(100%)}}

/* ---------- toast ---------- */
.toast{position:fixed;z-index:50;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:999px;background:#fff;box-shadow:0 14px 40px rgba(110,130,170,.25);font-size:16px;opacity:0;transform:translate(-50%,16px) scale(.9);pointer-events:none;transition:opacity .25s, transform .4s cubic-bezier(.34,1.56,.64,1)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast{width:max-content;max-width:calc(100vw - 32px)}
.toast-text{white-space:nowrap}
.toast.show.has-act{pointer-events:auto}
.toast-act{margin:0 -8px 0 4px;padding:7px 14px;border-radius:999px;background:var(--blue-100);color:var(--blue-600);font-size:14.5px;white-space:nowrap}
.toast-av{position:relative;width:44px;height:44px;border-radius:50%;overflow:hidden;background:#fff}
.toast-av img{position:absolute;left:-26%;top:-22%;width:152%;height:152%;object-fit:cover}
.toast-av.duo img{left:-10%;top:-6%;width:120%;height:120%}

/* ---------- desktop ---------- */
@media (min-width:960px){
  .app{display:grid;grid-template-columns:340px minmax(0,1fr);gap:32px;padding:24px 28px 48px}
  .m-head{display:none}
  .art{display:block;position:sticky;top:24px;height:calc(100vh - 48px);height:calc(100dvh - 48px);min-height:600px}
  .nav{position:static;display:inline-flex;gap:4px;padding:6px;margin:0 0 22px;border-radius:22px;background:#fff;box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav button{flex-direction:row;gap:8px;padding:10px 20px;font-size:15.5px;border-radius:17px;color:var(--ink-2)}
  .nav button .ic{width:19px;height:19px}
  .nav .bub{width:auto;height:auto}
  .nav button.on{background:var(--blue-100)}
  .nav button.on .bub{background:none;color:var(--blue-400);transform:none;box-shadow:none}
  .nav button.on span:last-child{margin-top:0}
  .nav button:hover:not(.on){background:var(--soft)}
  .toast{bottom:36px}
}

/* ---------- art panel ---------- */
.art-card{position:relative;height:100%;display:flex;flex-direction:column;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:28px 28px 0;overflow:hidden}
.art-brand{display:flex;align-items:center;gap:6px;font-size:14px;letter-spacing:.18em;color:var(--blue-400)}
.demo-pill{font-size:12px;letter-spacing:.06em;line-height:1;padding:4px 9px;border-radius:999px;background:var(--blue-100);color:var(--blue-600)}
.art-greet{margin-top:18px;font-size:15px;color:var(--ink-2)}
.art-date{font-size:36px;line-height:1.25;letter-spacing:.02em}
.art-wd{font-size:16px;color:var(--ink-2)}
.art-stage{position:relative;height:230px;margin:10px -12px 4px;flex:none}
.blob{position:absolute;border-radius:50%}
.blob.b1{width:170px;height:170px;left:4px;top:8px;background:radial-gradient(circle at 40% 40%, #FFEFF3, #FFE3EB)}
.blob.b2{width:170px;height:170px;right:0;top:56px;background:radial-gradient(circle at 60% 40%, #EEF6FD, #DDEDFB)}
.char{position:absolute;width:180px;height:180px;mix-blend-mode:multiply;animation:float 5s ease-in-out infinite}
.char.c1{left:-4px;top:0;--r:-7deg}
.char.c2{right:-8px;top:50px;--r:7deg;animation-delay:-2.5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-8px) rotate(var(--r))}}
.spark{position:absolute;animation:twinkle 3.2s ease-in-out infinite}
.spark.s1{left:168px;top:6px;width:20px;color:var(--butter)}
.spark.s2{left:150px;top:190px;width:14px;color:var(--pink-300);animation-delay:-1s}
.spark.s3{right:18px;top:16px;width:16px;color:var(--blue-300);animation-delay:-2s}
.spark.s4{left:16px;top:184px;width:12px;color:var(--blue-200);animation-delay:-.5s}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(20deg);opacity:.5}}
.bubble{position:absolute;border-radius:50%;border:1.5px solid var(--blue-200);background:rgba(255,255,255,.6);animation:rise 6s ease-in-out infinite}
.bubble.u1{width:12px;height:12px;left:190px;top:150px}
.bubble.u2{width:8px;height:8px;left:206px;top:126px;animation-delay:-3s;border-color:var(--pink-200)}
@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.art-prog{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.ap{display:grid;grid-template-columns:32px 40px 1fr auto;align-items:center;gap:8px;font-size:15px}
.ap-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--c1);color:var(--c6)}
.ap-ic .ic{width:17px;height:17px}
.ap-bar{height:8px;border-radius:9px;background:var(--c1);overflow:hidden}
.ap-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c3),var(--c4));transition:width .5s cubic-bezier(.3,.9,.3,1)}
.ap-num{font-size:14px;color:var(--ink-2);min-width:34px;text-align:right}
.art-streak{align-self:flex-start;margin-top:16px;box-shadow:none;background:var(--blue-50)}
.art-peek{margin:auto -28px 0;width:calc(100% + 56px);height:200px;object-fit:cover;object-position:50% 18%;mix-blend-mode:multiply;flex:none;transform:translateY(14px)}
@media (max-height:820px){ .art-peek{display:none} }

@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>

// Routines run in day order, which starts at the day-start hour: a 1am routine comes after an 11pm one.
const dayMin = m => (m - dayStartH * 60 + 1440) % 1440;
const byHour = (a, b) => dayMin(a.min) - dayMin(b.min);
const fmtTime = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
const activeSlots = () => state.slots.filter(x => !x.deleted).sort(byHour);
// A routine added today doesn't reach back into days already lived.
const slotLive = (id, date) => { const x = slotOf(id); return !x.deleted && (!x.from || date >= x.from); };
const slotOf = id => state.slots.find(x => x.id === id) || { id, name: '', min: 0, look: 'usagi' };
const lookOf = id => LOOKS[slotOf(id).look] || LOOKS.usagi;
const slotName = id => slotOf(id).name;
const slotIcon = id => lookOf(id).icon;
const slotImg = id => IMG[slotOf(id).look] || IMG.usagi;
const fitCls = src => src === IMG.usagi ? ' class="fit"' : '';
const tone = id => 'tone-' + lookOf(id).tone;
// The keys of a day record that hold a routine (skin is a list, note a string).
const recSlots = r => r ? Object.keys(r).filter(k => r[k] && typeof r[k] === 'object' && !Array.isArray(r[k])) : [];
const hasMarks = x => !!x && ['done', 'skip', 'extra'].some(k => (x[k] || []).length > 0);
// Routines shown on a day: the current ones, plus a removed one on past days it was used.
function slotsOn(date) {
  const r = state.days[date];
  return state.slots.filter(x => (!x.from || date >= x.from) && (!x.deleted || (date < today() && r && hasMarks(r[x.id])))).sort(byHour);
}
// "早晚" for a product used in several routines when their first characters differ; otherwise full names.
function timesLabel(times) {
  const names = activeSlots().filter(x => times.includes(x.id)).map(x => x.name);
  if (names.length === 1) return names[0];
  const firsts = names.map(n => n[0]);
  return new Set(firsts).size === firsts.length ? firsts.join('') : names.join('・');

function isScheduled(p, date, slot) {
  if (p.paused || p.deleted || !p.times.includes(slot) || !slotLive(slot, date)) return false;
  const f = freqFor(p, slot);
  if (f.type === 'weekly') return f.days.includes(dow(date));
  if (f.type === 'interval') {
    if (f.from === 'last') return dueSinceLast(p, f, date, slot);
    const n = diffDays(f.start, date);
    return n >= 0 && n % f.every === 0;
  }
  return true;
}
// "Every N days, counted from the last time it was used": a missed day rolls forward.
// Future days assume anything due today gets done today.
function dueSinceLast(p, f, date, slot) {
  const t = today(), last = lastDone(p.id, slot, date);
  const due = last ? addDays(last, f.every) : f.start;
  if (date <= t) return date >= due;
  const next = due > t ? due : t;
  return date >= next && diffDays(next, date) % f.every === 0;
}
let doneIdx = null;
function lastDone(id, slot, before) {
  if (!doneIdx) {
    doneIdx = {};
    for (const [d, r] of Object.entries(state.days)) {
      for (const s of recSlots(r)) for (const x of r[s].done || []) (doneIdx[x + s] = doneIdx[x + s] || []).push(d);
    }
    Object.values(doneIdx).forEach(a => a.sort());
  }
  const a = doneIdx[id + slot] || [];
  for (let i = a.length - 1; i >= 0; i--) if (a[i] < before) return a[i];
  return null;
}
const livePlan = (date, slot) => state.products.filter(p => isScheduled(p, date, slot)).sort(byStep).map(p => p.id);

function dayRec(date, create) {
  let d = state.days[date];
  if (!d && create) d = state.days[date] = {};
  if (d) {
    const active = activeSlots().map(x => x.id);
    for (const s of [...new Set([...active, ...recSlots(d)])]) {
      if (!active.includes(s) && !d[s]) continue;
      d[s] = d[s] || {}; d[s].done = d[s].done || []; d[s].extra = d[s].extra || []; d[s].skip = d[s].skip || []; d[s].why = d[s].why || {};
      // Freeze both routines the moment a day gets a record, even one that was never ticked,
      // so later product edits can't rewrite that day's history.
      if (create && !d[s].plan && active.includes(s)) d[s].plan = livePlan(date, s);
    }
    d.skin = d.skin || []; d.note = d.note || '';
  }
  return d;
}
// Past days keep the plan they had when recorded; today and future follow the live schedule.
function touch(date, slot) {
  const r = dayRec(date, true)[slot];
  if (!r.plan || date >= today()) r.plan = livePlan(date, slot);
  return r;
}
function slotItems(date, slot) {
  const r = state.days[date]?.[slot];
  const done = r?.done || [], skip = r?.skip || [], why = r?.why || {};
  const planned = (r?.plan && date < today() ? r.plan : livePlan(date, slot)).filter(byId);
  const extra = [...(r?.extra || []), ...done, ...skip].filter((id, i, a) => byId(id) && !planned.includes(id) && a.indexOf(id) === i);
  return [...planned.map(id => ({ id, extra: false })), ...extra.map(id => ({ id, extra: true }))]
    .map(x => {
      const isSkip = skip.includes(x.id), isDone = !isSkip && done.includes(x.id);
      // A skipped item counts as handled, so choosing to skip never breaks the streak.
      return { ...x, p: byId(x.id), done: isDone, skip: isSkip, ok: isDone || isSkip, why: isSkip ? why[x.id] || '' : '' };
    })
    .sort((a, b) => byStep(a.p, b.p));
}
function dayState(date) {
  const all = slotsOn(date).flatMap(x => slotItems(date, x.id));
  if (!all.length) return 'rest';
  return all.every(x => x.ok) ? 'complete' : 'incomplete';
}
function streak() {
  let d = today(), n = 0;
  if (dayState(d) !== 'complete') d = addDays(d, -1);
  for (let i = 0; i < 400; i++, d = addDays(d, -1)) {
    const st = dayState(d);
    if (st === 'complete') n++;
    else if (st === 'incomplete') break;
  }
  return n;
}
const slotComplete = (date, slot) => { const it = slotItems(date, slot); return it.length > 0 && it.every(x => x.ok); };

const freqLabel = f => f.type === 'weekly' ? (f.days.length === 7 ? '每天' : '週' + WEEK.filter(d => f.days.includes(d)).map(d => WD[d]).join(''))
  : f.type === 'interval' ? `每 ${f.every} 天${f.from === 'last' ? '・順延' : ''}` : '每天';
const isSplit = p => Object.keys(p.freqBy || {}).length > 0;
const scheduleLabel = p => isSplit(p) ? p.times.map(t => `${timesLabel([t])} ${freqLabel(freqFor(p, t))}`).join('・') : freqLabel(p.freq);
// What the product page and journal say about when it's used: "早晚 每天", "晚上 週二四六", "早上 每天・晚上 週一三五".
const whenLabel = p => isSplit(p) ? scheduleLabel(p) : p.times.length ? `${timesLabel(p.times)} ${scheduleLabel(p)}` : scheduleLabel(p);

// Today, the routine coming up (from two hours before its time) goes first, then the ones after it, then the earlier ones.
// One whose time passed within the last three hours and isn't done yet stays ahead of the next, so 11pm skincare isn't
// pushed down by a 12:30 bedtime routine.
function todayOrder(d) {
  const ids = slotsOn(d).map(x => x.id);
  if (d !== today()) return ids;
  const d0 = new Date(), now = dayMin(d0.getHours() * 60 + d0.getMinutes());
  let cur = 0;
  ids.forEach((id, i) => { if (dayMin(slotOf(id).min) - 120 <= now) cur = i; });
  while (cur > 0 && dayMin(slotOf(ids[cur - 1]).min) >= now - 180 && !slotComplete(d, ids[cur - 1])
    && slotItems(d, ids[cur - 1]).length) cur--;
  return [...ids.slice(cur), ...ids.slice(0, cur)];
}

const slotCount = (n, total) => !total ? '' : n === total ? `<span class="done-badge">${icon('check')}完成</span>${icon('chev', 'fold-ic')}` : `${n} / ${total}`;

// Rows of a list sorted by category, with a small heading before each category when there is more than one.
function withCats(list, prod, row, head) {
  const many = new Set(list.map(x => prod(x).cat)).size > 1;
  let last = null;
  return list.map(x => {
    const c = catById(prod(x).cat), sep = many && c !== last ? head(c) : '';
    last = c;
    return sep + row(x);
  }).join('');
}

const skipLabel = why => why ? `略過・${esc(why)}` : '略過';

// The most recent day in the last week that had something planned but was never opened.
function missedDay() {
  const keys = Object.keys(state.days).sort();
  if (!keys.length) return null;
  for (let i = 1; i <= 7; i++) {
    const d = addDays(today(), -i);
    if (d < keys[0] || d <= state.missDismissed) break;
    if (!state.days[d] && activeSlots().some(x => livePlan(d, x.id).length > 0)) return d;
  }
  return null;
}

function prodCard(p, sort) {
  const times = activeSlots().filter(x => p.times.includes(x.id)).map(x => `<span class="${tone(x.id)}">${icon(slotIcon(x.id))}</span>`).join('');
  const life = lifeInfo(p);
  return `<article class="card prod${p.paused ? ' is-paused' : ''}${sort ? ' sorting' : ''}"${sort ? '' : ` data-act="detail" data-id="${p.id}" role="button" tabindex="0"`}>
    <div class="prod-top">
      <i class="dot" style="background:${COLORS[p.color]}"></i>
      <div class="prod-name">${esc(p.name)}</div>
      ${sort ? `<div class="sort-btns">
        <button data-act="move" data-id="${p.id}" data-v="-1" aria-label="往前"${sort.first ? ' disabled' : ''}>${icon('aup')}</button>
        <button data-act="move" data-id="${p.id}" data-v="1" aria-label="往後"${sort.last ? ' disabled' : ''}>${icon('adown')}</button>
      </div>` : `<div class="prod-times">${times}</div>`}
    </div>
    ${p.note && !sort ? `<div class="prod-note">${esc(p.note)}</div>` : ''}
    ${sort ? '' : `<div class="prod-meta"><span class="tag">${scheduleLabel(p)}</span>${p.times.length ? '' : '<span class="tag warn">沒有時段</span>'}${life.expired ? '<span class="tag warn">已過期</span>' : life.soon ? `<span class="tag warn">${life.left} 天後到期</span>` : ''}${p.low ? '<span class="tag warn">快用完</span>' : ''}</div>`}
  </article>`;
}

// When a product should be used up by: opening date + shelf life after opening, or the printed expiry, whichever is first.
function lifeInfo(p) {
  let due = '';
  if (p.opened && p.life) { const n = parseInt(p.life, 10); due = p.life.endsWith('d') ? addDays(p.opened, n) : addMonths(p.opened, n); }
  if (p.expiry && (!due || p.expiry < due)) due = p.expiry;
  if (!due) return {};
  const left = diffDays(today(), due);
  return { due, left, expired: left < 0, soon: left >= 0 && left <= 30 };
}

function productStats(id) {
  const t = today(), why = {}, strip = [];
  let planned = 0, done = 0, skipped = 0, first = '', last = '';
  for (let i = 29; i >= 0; i--) {
    const d = addDays(t, -i);
    let st = 'none';
    // Only days she actually recorded count; today's unfinished items don't count against her.
    if (state.days[d] || d === t) for (const s of slotsOn(d).map(x => x.id)) {
      const x = slotItems(d, s).find(y => y.id === id);
      if (!x || (d === t && !x.ok)) continue;
      if (!x.extra) planned++;
      if (x.done) { done++; st = 'done'; }
      else if (x.skip) { skipped++; if (st !== 'done') st = 'skip'; if (x.why) why[x.why] = (why[x.why] || 0) + 1; }
      else if (st === 'none') st = 'miss';
    }
    strip.push({ d, st });
  }
  for (const k of Object.keys(state.days).sort()) {
    const r = state.days[k];
    if (recSlots(r).some(s => (r[s].done || []).includes(id))) { if (!first) first = k; last = k; }
  }
  return { done, skipped, why, strip, first, last, rate: planned ? Math.min(100, Math.round((done + skipped) / planned * 100)) : null };
}

// Setting up many products on one day reads as one line instead of a wall of chips.
function journalEvents(evs) {
  const adds = evs.filter(e => e.k === 'add');
  const rest = (adds.length > 2 ? evs.filter(e => e.k !== 'add') : evs).map(e => eventText(e));
  return adds.length > 2 ? [`開始使用 ${adds.length} 項`, ...rest] : rest;
}

}

function moveProduct(id, dir) {
  const p = byId(id);
  const group = state.products.filter(x => !x.deleted && !x.paused && x.cat === p.cat && x.step === p.step).sort(byStep);
  const i = group.indexOf(p), j = i + dir;
  if (j < 0 || j >= group.length) return;
  [group[i], group[j]] = [group[j], group[i]];
  group.forEach((x, k) => { x.order = k; });
  save();
  render();
}

function renderHistory() {
  const t = today();
  const [y, m] = ui.month.split('-').map(Number);
  const isCur = ui.month === t.slice(0, 7);
  const n = new Date(y, m, 0).getDate();
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const dates = Array.from({ length: n }, (_, i) => `${ui.month}-${pad(i + 1)}`);
  const C = 2 * Math.PI * 16;
  const noted = d => { const r = state.days[d]; return !!r && ((r.skin && r.skin.length > 0) || !!(r.note && r.note.trim())); };
  const doneDays = {};
  const cells = dates.map(d => {
    const future = d > t;
    const per = future ? [] : slotsOn(d).map(x => [x.id, slotItems(d, x.id)]);
    per.forEach(([id, it]) => { if (it.length && it.every(x => x.ok)) doneDays[id] = (doneDays[id] || 0) + 1; });
    // One ring per day: how much of that day's routines was ticked off.
    const all = per.flatMap(x => x[1]), n = all.filter(x => x.ok).length;
    const showRing = all.length > 0 && (state.days[d] || d === t);
    const ring = showRing ? `<svg class="ring" viewBox="0 0 36 36"><circle class="ring-track" cx="18" cy="18" r="16"/>${n ? `<circle class="ring-fill" cx="18" cy="18" r="16" stroke-dasharray="${(n / all.length * C).toFixed(2)} ${C.toFixed(2)}"/>` : ''}</svg>` : '';
    const full = all.length > 0 && n === all.length;
    return `<button class="cal-cell${d === t ? ' today' : ''}${future ? ' future' : ''}${full ? ' full' : ''}" data-act="goto-day" data-date="${d}">
      <span class="cal-num">${ring}${parse(d).getDate()}</span>
    </button>`;
  }).join('');
  // Journal: notes, skin tags, skips with their reasons, and product changes, day by day.
  const evByDay = {};
  state.events.filter(e => e.d.startsWith(ui.month)).forEach(e => { (evByDay[e.d] = evByDay[e.d] || []).push(e); });
  const skipsOn = d => {
    const r = state.days[d], out = [];
    if (r) for (const s of recSlots(r)) for (const id of r[s].skip || []) {
      const p = byId(id), w = r[s].why && r[s].why[id];
      if (p) out.push(`略過 ${esc(p.name)}${w ? `・${esc(w)}` : ''}`);
    }
    return out;
  };
  const notes = dates.filter(d => noted(d) || evByDay[d] || skipsOn(d).length).reverse().map(d => {
    const r = state.days[d] || {}, skips = skipsOn(d), evs = evByDay[d] || [];
    return `<button class="note-row" data-act="goto-day" data-date="${d}">
      <span class="note-date"><b>${parse(d).getDate()}</b><span>週${WD[dow(d)]}</span></span>
      <span class="note-body">
        ${r.skin && r.skin.length ? `<span class="note-tags">${r.skin.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</span>` : ''}
        ${r.note && r.note.trim() ? `<span class="note-text">${esc(r.note.trim())}</span>` : ''}
        ${skips.map(x => `<span class="note-skip">${x}</span>`).join('')}
        ${evs.length ? `<span class="note-ev">${journalEvents(evs).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</span>` : ''}
      </span>
    </button>`;
  });
  const tagCount = {};
  dates.forEach(d => ((state.days[d] && state.days[d].skin) || []).forEach(x => { tagCount[x] = (tagCount[x] || 0) + 1; }));
  const tags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]);
  const maxTag = Math.max(1, ...tags.map(x => x[1]));
  $('#view-history').innerHTML = `
    ${dateBar('month', `${y}年${m}月`, isCur ? '本月' : '', isCur ? '' : '回本月')}
    <section class="card hist-head">
      <img src="${IMG.duo}" alt="">
      <div class="stats">
        ${state.slots.filter(x => !x.deleted || doneDays[x.id]).sort(byHour).map(x => `<div class="stat ${tone(x.id)}">${icon(slotIcon(x.id))}<b>${doneDays[x.id] || 0}</b><span>${esc(x.name)}完成</span></div>`).join('')}
        <div class="stat">${streakFace()}<b>${streak()}</b><span>連續天數</span></div>
      </div>
    </section>
    <section class="card cal">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EA9DF"/><stop offset="1" stop-color="#EF98B0"/></linearGradient></defs></svg>
      <div class="cal-grid">
        ${WEEK.map(d => `<div class="cal-wd">${WD[d]}</div>`).join('')}
        ${'<span></span>'.repeat(lead)}${cells}
      </div>
    </section>
    ${tags.length ? `<section class="card trend">
      <h2>${icon('drop')}今天的狀態</h2>
      ${tags.map(([x, n]) => `<div class="trend-row"><span>${esc(x)}</span><span class="trend-bar"><i style="width:${n / maxTag * 100}%"></i></span><b>${n} 天</b></div>`).join('')}
    </section>` : ''}
    ${notes.length ? `<section class="card notes">
      <h2>${icon('book')}日誌<small>${notes.length}</small></h2>
      ${notes.join('')}
    </section>` : ''}`;
}

// Forget the saved shell and load the newest page.
async function updateApp() {
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  } catch (e) {}
  location.reload();
}

const streakFace = (pop = false) => `<img class="face${pop ? ' pop' : ''}" src="${dayState(today()) === 'complete' ? IMG.faceDone : IMG.faceRest}" alt="">`;

/* ---------- actions ---------- */
function setTab(v) {

  ui.tab = v;
  render();

// Tap: done <-> not done (a skipped item goes back to not done). Long-press: skip <-> not done.
function mark(slot, id, mode, d = ui.date) {
  if (d > today()) return;
  const before = slotComplete(d, slot);
  const r = touch(d, slot);
  const wasSkip = r.skip.includes(id), wasDone = r.done.includes(id);
  r.done = r.done.filter(x => x !== id);
  r.skip = r.skip.filter(x => x !== id);
  delete r.why[id];
  const skipped = mode === 'skip' && !wasSkip;
  if (skipped) r.skip.push(id);
  else if (mode !== 'skip' && !wasSkip && !wasDone) r.done.push(id);
  save();
  refreshMark(d, slot, id);
  afterMark(d, slot, before);
  if (skipped) askWhy(d, slot, id);
}
function refreshMark(d, slot, id) {
  if (ui.tab === 'today' && ui.date === d) patchSlot(slot, id);
  else if (!(ui.tab === 'week' && patchWeekCell(d, slot, id))) render();
}

// After a skip, offer a reason; closing the sheet simply leaves it blank.
function askWhy(date, slot, id) {
  ui.whyFor = { date, slot, id };
  $('#whyTitle').textContent = `為什麼略過「${byId(id).name}」？`;
  renderWhy();
  $('#whyDlg').showModal();
}
function renderWhy() {
  $('#whyList').innerHTML = state.skipReasons.map(w => `<button type="button" class="chip" data-act="why" data-v="${esc(w)}">${esc(w)}</button>`).join('');
}
function setWhy(w) {
  const { date, slot, id } = ui.whyFor;
  const r = dayRec(date, true)[slot];
  if (r.skip.includes(id)) r.why[id] = w;
  save();
  $('#whyDlg').close();
  refreshMark(date, slot, id);
}

// "全部勾選" (or a long-press on the title) ticks off everything left; the toast offers 復原.
function completeAll(slot) {
  const d = ui.date;
  if (d > today()) return;
  const before = slotComplete(d, slot);
  const r = touch(d, slot);
  const todo = slotItems(d, slot).filter(x => !x.ok).map(x => x.id);
  if (!todo.length) return;
  r.done.push(...todo);
  save();
  todo.forEach(id => patchSlot(slot, id));
  afterMark(d, slot, before, () => undoAll(d, slot, todo));
}

function undoAll(d, slot, ids) {
  const r = touch(d, slot);
  r.done = r.done.filter(x => !ids.includes(x));
  save();
  const card = ui.tab === 'today' && ui.date === d && $(`#view-today .slot-${slot}`);
  if (card) { setFolded(card, false); ids.forEach(id => patchSlot(slot, id)); } else render();
  renderSide();
}

function afterMark(d, slot, before, undo) {
  renderSide();
  if (before || !slotComplete(d, slot)) return;
  pushFin(d, slot);
  ui.open.delete(d + slot);
  setTimeout(() => {
    const card = $(`#view-today .slot-${slot}`);
    if (card && ui.date === d && slotComplete(d, slot) && !ui.open.has(d + slot)) setFolded(card, true);
  }, 700);
  const action = undo && { label: '復原', fn: undo };
  if (dayState(d) === 'complete') toast('duo', '全部完成！', action);
  else toast(slotImg(slot), `${slotName(slot)}完成！`, action);
}

// Update the tapped row in place: rebuilding the whole view made iPhone Safari jump back to the top.
function patchSlot(slot, id) {
  const card = $(`#view-today .slot-${slot}`);
  const btn = card && card.querySelector(`[data-act="toggle"][data-id="${id}"]`);
  if (!btn) { render(); return; }
  const items = slotItems(ui.date, slot);
  const n = items.filter(x => x.ok).length;
  const x = items.find(y => y.id === id) || {};
  const li = btn.closest('.item');
  li.classList.toggle('is-done', !!x.done);
  li.classList.toggle('is-skip', !!x.skip);
  $('.tag-skip', li).innerHTML = skipLabel(x.why);
  li.classList.remove('pop');
  void li.offsetWidth;
  li.classList.add('pop');
  btn.setAttribute('aria-pressed', !!x.done);
  card.classList.toggle('is-complete', n === items.length);
  $('.slot-count', card).innerHTML = slotCount(n, items.length);
  $('.bar i', card).style.width = `${n / items.length * 100}%`;
}

// A finished routine folds into one line; tapping its title opens it again.
function fold(slot) {
  const card = $(`#view-today .slot-${slot}`);
  if (!card || !card.classList.contains('is-complete')) return;
  const opening = card.classList.contains('is-folded');
  opening ? ui.open.add(ui.date + slot) : ui.open.delete(ui.date + slot);
  setFolded(card, !opening);
}
function setFolded(card, folded) {
  card.classList.toggle('is-folded', folded);
  $('.slot-title', card).setAttribute('aria-expanded', !folded);
}

let toastTimer, toastAction = null;
function toast(img, text, action) {

  $('img', t).classList.toggle('fit', $('img', t).src.endsWith(IMG.usagi));

  toastAction = action ? action.fn : null;

}

}

const defaultStep = catId => { const st = catById(catId).steps; return st.includes('其他') ? '其他' : (st[st.length - 1] || '其他'); };
// A step named in the item's name wins: the one ending last, since the noun comes last ("維他命C精華" is a 精華),
// then the longest; then keyword hints. The step found also picks the category,
// unless she chose the category herself.
function guessStep(name, only) {
  const all = (only ? [catById(only)] : state.cats).flatMap(c => c.steps.filter(x => x !== '其他').map(x => [c.id, x]));
  const end = x => name.lastIndexOf(x) + x.length;
  const named = all.filter(([, x]) => name.includes(x)).sort((a, b) => end(b[1]) - end(a[1]) || b[1].length - a[1].length)[0];
  if (named) return { cat: named[0], step: named[1] };
  for (const [hint, re] of STEP_HINTS) {
    const hit = re.test(name) && all.find(([, x]) => x.includes(hint));
    if (hit) return { cat: hit[0], step: hit[1] };
  }
  const cat = only || draft.cat;
  return { cat, step: defaultStep(cat) };
}

const copy = o => JSON.parse(JSON.stringify(o));
// Keep a product's routines and per-routine frequencies consistent; a split left with one routine collapses into it.
function fitTimes(p, times) {
  const order = activeSlots().map(x => x.id);
  p.times = order.filter(t => times.includes(t));
  if (!isSplit(p)) return;
  Object.keys(p.freqBy).forEach(t => { if (!p.times.includes(t)) delete p.freqBy[t]; });
  if (p.times.length < 2) {
    if (p.freqBy[p.times[0]]) p.freq = p.freqBy[p.times[0]];
    p.freqBy = {};
  } else p.times.forEach(t => { if (!p.freqBy[t]) p.freqBy[t] = copy(p.freq); });
}
function setTimes(v) {
  fitTimes(draft, draft.times.includes(v) ? draft.times.filter(x => x !== v) : [...draft.times, v]);
}

function swapWith(id) {

function saveSlot() {

  const [h, m] = ($('#sTime').value || '12:00').split(':').map(Number);
  const fields = { name, min: (h || 0) * 60 + (m || 0), look: slotDraft.look };
  const partner = slotDraft.swapWith && state.slots.find(y => y.id === slotDraft.swapWith);
  if (partner) partner.look = slotDraft.orig;
  const x = slotDraft.id && state.slots.find(y => y.id === slotDraft.id);
  // A new routine starts today, so days already lived don't grow an unticked card.

function shake(el) {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}

function saveForm() {
  draft.name = $('#fName').value.trim();
  draft.note = $('#fNote').value.trim();
  if (!draft.name) { shake($('#fName')); $('#fName').focus(); return; }
  if (!draft.times.length) { shake($('#fTimes')); return; }
  const noDays = [draft.freq, ...Object.values(draft.freqBy)].some(f => f.type === 'weekly' && !f.days.length);
  if (noDays) { form.more = true; renderForm(); shake($('#fFreqWrap')); return; }
  let p = draft;
  const old = draft.id && byId(draft.id);
  if (old) {
    state.products[state.products.indexOf(old)] = draft;
    if (old.paused !== draft.paused) logEvent(p.id, draft.paused ? 'pause' : 'resume');
    if (whenLabel(old) !== whenLabel(draft)) logEvent(p.id, 'freq', whenLabel(draft));
  } else {
    const order = Math.max(-1, ...state.products.map(x => x.order)) + 1;
    p = { ...draft, id: uid(), created: Date.now(), order };
    state.products.push(p);
    logEvent(p.id, 'add');
  }
  if (p.opened && (!old || old.opened !== p.opened)) logEvent(p.id, 'open', null, p.opened);
  // Made from "加一項": put it on that day straight away.
  const to = ui.addTo;
  if (to && !draft.id && p.times.includes(to.slot) && !slotItems(to.date, to.slot).some(x => x.id === p.id)) {
    const r = touch(to.date, to.slot);
    if (!r.extra.includes(p.id)) r.extra.push(p.id);
    ui.pop = to.slot + p.id;
  }
  if (pushOn()) {
    const rt = $('#fRemindTime'), r = form.remind;
    if (rt && rt.value) r.min = parseTime(rt.value, r.min);
    if (r.mode === 'off') { if (push.items[p.id]) push.items[p.id] = { ...push.items[p.id], on: false }; }
    else push.items[p.id] = { on: true, min: r.mode === 'own' ? r.min : null };
    storePush();
  }
  save();
  $('#formDlg').close();
  render();
}

$('#fName').addEventListener('input', e => {
  if (form.stepTouched) return;
  const g = guessStep(e.target.value, form.catTouched && draft.cat);
  if (g.step === draft.step && g.cat === draft.cat) return;
  draft.step = g.step;
  if (g.cat !== draft.cat) { draft.cat = g.cat; if (!form.colorTouched) draft.color = catById(g.cat).color; }
  renderForm();
});

document.addEventListener('click', e => {
  const dlg = e.target.closest('dialog');
  if (e.target.tagName === 'DIALOG') { e.target.close(); return; }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const { act, v, id, slot, date } = t.dataset;
  switch (act) {
    case 'tab': setTab(v); break;
    case 'day-prev': ui.date = addDays(ui.date, -1); render(); break;
    case 'day-next': ui.date = addDays(ui.date, 1); render(); break;
    case 'day-now': ui.date = today(); render(); break;
    case 'week-prev': ui.week = addDays(ui.week, -7); render(); break;
    case 'week-next': ui.week = addDays(ui.week, 7); render(); break;
    case 'week-now': ui.week = weekStart(today()); render(); break;
    case 'month-prev':
    case 'month-next': {
      const [y, m] = ui.month.split('-').map(Number);
      const d = new Date(y, m - 1 + (act === 'month-next' ? 1 : -1), 1);
      ui.month = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      render(); break;
    }
    case 'month-now': ui.month = today().slice(0, 7); render(); break;
    case 'goto-day': ui.date = date; setTab('today'); break;
    case 'toggle': mark(slot, id, 'tap'); break;
    case 'wk-mark': mark(slot, id, 'tap', date); break;
    case 'why': setWhy(v); break;
    case 'edit-reasons': reasonEditor(); break;
    case 'miss-dismiss': state.missDismissed = date; save(); render(); break;
    case 'detail': openDetail(id); break;
    case 'detail-edit': $('#detailDlg').close(); openForm(id); break;
    case 'toggle-low': toggleLow(id); break;
    case 'restock': restock(id); break;
    case 'f-life': draft.life = v; renderForm(); break;
    case 'f-clear': draft[t.dataset.k] = ''; renderForm(); break;
    case 'extra': openExtra(slot); break;
    case 'fold': fold(slot); break;
    case 'all': completeAll(slot); break;
    case 'add-extra': addExtra(slot, id); break;
    case 'unextra': removeExtra(slot, id); break;
    case 'skin': toggleSkin(t, v); break;
    case 'edit-skin': skinEditor(); break;
    case 'edit-steps': stepEditor(draft.cat); break;
    case 'edit-slot': openSlot(id); break;
    case 'new-slot': openSlot(); break;
    case 's-look': pickLook(v); break;
    case 's-swap': swapWith(id); break;
    case 's-delete': deleteSlot(); break;
    case 'edit-cat': openCat(id); break;
    case 'new-cat': openCat(); break;
    case 'cat-up': moveCat(id, -1); break;

    case 'push-slot': pushSlotToggle(id); break;

    case 'push-last': openPushSheet('last'); break;
    case 'push-recover': openPushSheet('recover'); break;

    case 'push-item-off': push.items[id] = { ...push.items[id], on: false }; storePush(); render(); pushSync(); break;
    case 'p-scope': pullPushDraft(); pushDraft.scope = v; renderPushSheet(); break;

      if (confirm('停止同步後，這台裝置的紀錄會留著，但不會再和雲端同步。確定嗎？')) { stopSync(); render(); }
      break;
    case 'sync-create-go': setTab('settings'); openSync('create'); break;

    case 'new': openForm(); break;
    case 'new-from-extra': $('#extraDlg').close(); openForm(null, { date: ui.date, slot: $('#extraDlg').dataset.slot }); break;

    case 'f-day': { const f = fq(t.dataset.k), n = Number(v); f.days = f.days.includes(n) ? f.days.filter(x => x !== n) : [...f.days, n]; renderForm(); break; }
    case 'f-preset': fq(t.dataset.k).days = [...PRESETS[v][1]]; renderForm(); break;
    case 'f-every': { const f = fq(t.dataset.k); f.every = Math.min(30, Math.max(2, f.every + Number(v))); renderForm(); break; }
    case 'f-from': fq(t.dataset.k).from = v; renderForm(); break;
    case 'f-color': draft.color = v; form.colorTouched = true; renderForm(); break;
    case 'f-pause': draft.paused = !draft.paused; renderForm(); break;
    case 'f-delete':
      if (confirm(`要刪除「${draft.name || $('#fName').value}」嗎？過去的紀錄會保留。`)) {
        // Soft delete: hidden everywhere, but past records still show what was used.
        byId(draft.id).deleted = true;
        logEvent(draft.id, 'delete');
        save();
        $('#formDlg').close();
        render();
      }
      break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'dayNote') { dayRec(ui.date, true).note = e.target.value; saveSoon(); }
  if (e.target.dataset.start && draft) fq(e.target.dataset.start).start = e.target.value || today();
  if (e.target.dataset.dateK && draft) draft[e.target.dataset.dateK] = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset.dateK && draft) renderForm();
  if (e.target.id === 'dayStartSel') {
    state.dayStart = dayStartH = Number(e.target.value);
    lastToday = today();
    ui.date = today();
    state.slots.sort(byHour);
    save();
    render();
  }
});

// Long-press (or right-click): skip an item / tick off a whole routine.
let pressTimer = null, pressFired = false, pressAt = null;
const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; $$('.holding').forEach(x => x.classList.remove('holding')); };
function hold(el) {
  if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(12);
  if (el.dataset.hold === 'skip') mark(el.dataset.slot, el.dataset.id, 'skip');
  if (el.dataset.hold === 'all') completeAll(el.dataset.slot);
  if (el.dataset.hold === 'title') openTitle();
  if (el.dataset.hold === 'wk-skip') mark(el.dataset.slot, el.dataset.id, 'skip', el.dataset.date);
}
document.addEventListener('pointerdown', e => {
  pressFired = false;
  const el = e.target.closest('[data-hold]');
  if (!el || e.button > 0) return;
  pressAt = [e.clientX, e.clientY];
  el.classList.add('holding');
  pressTimer = setTimeout(() => { pressTimer = null; pressFired = true; el.classList.remove('holding'); hold(el); }, 500);
});
document.addEventListener('pointermove', e => { if (pressTimer && Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]) > 10) cancelPress(); });
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-hold]');
  if (!el) return;
  e.preventDefault();
  if (pressFired) return;
  const touchHold = !!pressTimer;
  cancelPress();
  if (touchHold) pressFired = true;
  hold(el);
});
// The click that ends a long-press must not also count as a tap.
document.addEventListener('click', e => { if (pressFired) { pressFired = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button]')) { e.preventDefault(); e.target.click(); }
  // Enter that picks a Chinese IME candidate must not submit the form.
  if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229) && e.target.closest('form')) e.preventDefault();
});

let lastToday = today();
function refresh() {
  if ($('dialog[open]')) return;
  let changed = false;
  try { changed = (localStorage.getItem(KEY) || '') !== JSON.stringify(state); } catch (e) {}
  if (changed) state = load();
  if (today() !== lastToday) {
    if (ui.date === lastToday) ui.date = today();
    lastToday = today();
    changed = true;
  }
  if (changed) render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { flush(); if (sync.timer) syncNow(true); }
  else { refresh(); syncNow(); pushSync(); }
});
window.addEventListener('online', () => syncNow());
// The page can stay open across midnight; check the date once a minute.
setInterval(() => { if (!document.hidden && today() !== lastToday) refresh(); }, 60000);
window.addEventListener('pagehide', flush);

/* ---------- init ---------- */
$('#nav').innerHTML = TABS.map(([v, n, ic]) => `<button data-act="tab" data-v="${v}"><span class="bub">${icon(ic)}</span><span>${n}</span></button>`).join('');
$$('[data-act="close"]').forEach(b => { b.innerHTML = icon('x'); });
$('#tourX').innerHTML = icon('x');
$$('[data-act="edit-steps"], [data-act="cat-steps"]').forEach(b => { b.innerHTML = icon('pen'); });
$('[data-act="edit-reasons"]').innerHTML = icon('pen');
// ?demo=reset brings the sample data back to its original state.
if (DEMO && new URLSearchParams(location.search).get('demo') === 'reset') {
  try { localStorage.removeItem(KEY); localStorage.removeItem(NEWS_KEY); } catch (e) {}
  history.replaceState(null, '', location.pathname + '?demo');
}
$('#fMoreBtn').insertAdjacentHTML('beforeend', icon('chev'));
// Records saved before launch under the old key were test data; start the real tool clean.
if (!DEMO) { try { localStorage.removeItem('skincare-diary-v1'); } catch (e) {} }
[IMG.faceDone, IMG.faceRest].forEach(src => { new Image().src = src; });
const start = () => {
  state = load();
  if (cloudReady()) { loadSync(); loadPush(); }
  render();
  syncNow();
  pushSync();
  // Opened from a reminder: land on what it was about, then tidy the address.
  if (!DEMO && new URLSearchParams(location.search).get('from') === 'push') { pushGo(new URL(location.href)); history.replaceState(null, '', location.pathname); }
  // Someone just starting out has nothing "new" to catch up on; the tour covers it.
  if (!DEMO && newsSeen() === null && !state.products.length) setNewsSeen(APP_VERSION);
  if (!DEMO && !state.products.length && !tourSeen()) openTour();
};
// Works offline and can be added to the home screen. Not on a local dev server, where it would hide edits (add ?sw to try it).
if ('serviceWorker' in navigator && (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || new URLSearchParams(location.search).has('sw'))) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
// A reminder tapped while the app is already open comes in as a message from the service worker.
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'push-go') pushGo(new URL(e.data.url, location.href)); });
// Ask the browser not to clear this site's saved list when it's low on space.
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if (DEMO) {
  $$('.m-brand, .art-brand').forEach(el => el.insertAdjacentHTML('beforeend', '<span class="demo-pill">示範</span>'));
  const s = document.createElement('script');
  s.src = 'demo.js';
  s.onload = s.onerror = start;
  document.head.appendChild(s);
} else start();
})();
</script>
</body>
